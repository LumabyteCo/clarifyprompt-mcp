category:
  id: chat
  label: Chat
  description: General conversation & Q&A
  defaultPlatform: claude
  defaultMode: detailed

# Currency policy (1.16.0): entries touched by a fact-verification pass carry
# `verifiedAt`. Entries without a date have not been re-verified recently.
# Note: chat/document/code categories are portable-by-default — naming a
# platform opts into that vendor's specific idioms.

platforms:
  - id: claude
    label: Claude (Sonnet 5 / Opus 4 line)
    description: "Anthropic — XML-tagged structure, extended thinking, artifacts; latest: claude-sonnet-5"
    verifiedAt: "2026-10-05"
    syntaxHints:
      - system prompts
      - XML tags
      - extended thinking (thinking budgets)
      - long context
      - artifacts
      - temperature is rejected on thinking-enabled models (use default)

  - id: chatgpt
    label: ChatGPT (GPT-5)
    description: OpenAI — reasoning models; GPT-5 current flagship, custom GPTs, web browsing
    verifiedAt: "2026-10-05"
    syntaxHints:
      - system prompts / custom instructions
      - browsing
      - code interpreter
      - custom GPTs
      - reasoning models: max_completion_tokens (not max_tokens), temperature fixed at 1

  - id: gemini
    label: Gemini (Flash latest / Pro)
    description: Google — multimodal, long context, grounding with Google Search
    verifiedAt: "2026-10-05"
    syntaxHints:
      - multimodal input
      - Google integration
      - long context
      - grounding

  - id: llama
    label: Llama
    description: Meta, open weights, local deployment
    syntaxHints:
      - open weights
      - system prompts
      - local deployment
      - fine-tunable
      - Ollama/vLLM

  - id: deepseek
    label: DeepSeek
    description: Open weights, strong reasoning (R1/V3)
    syntaxHints:
      - open weights
      - system prompts
      - chain of thought
      - deep reasoning
      - local deployment

  - id: qwen
    label: Qwen
    description: Alibaba, open weights, multilingual
    syntaxHints:
      - open weights
      - system prompts
      - multilingual
      - tool use
      - local deployment

  - id: kimi
    label: Kimi
    description: Moonshot AI, ultra-long context (2M tokens)
    syntaxHints:
      - ultra-long context
      - document analysis
      - natural language
      - file upload

  - id: glm
    label: GLM (Z.ai)
    description: Z.ai (formerly Zhipu AI), GLM-4.6+ line, open weights
    verifiedAt: "2026-10-05"
    syntaxHints:
      - open weights
      - system prompts
      - multilingual
      - tool use
      - local deployment

  - id: minimax-chat
    label: Minimax
    description: Minimax, strong general reasoning
    syntaxHints:
      - system prompts
      - function calling
      - long context
      - multilingual
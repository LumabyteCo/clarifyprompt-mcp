name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Minimize scope of the default GITHUB_TOKEN — the publish job adds `id-token: write` explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Build + typecheck across supported Node versions + OSes.
  # Catches: TS regressions, dep-tree breakages, platform-specific native-module issues.
  # ---------------------------------------------------------------------------
  build:
    name: build (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install deps (with prebuilt native bindings)
        run: npm ci

      - name: Typecheck + build
        run: npm run build

      - name: Verify dist actually runs
        # Start the server, send an MCP initialize, confirm the server responds, then stop.
        # Catches: broken imports, missing files, crash-on-boot.
        # Portable across Linux + macOS (macOS lacks GNU `timeout`).
        shell: bash
        run: |
          node --input-type=module -e "
            import { spawn } from 'node:child_process';

            const env = {
              ...process.env,
              LLM_API_URL: 'http://127.0.0.1:1/v1',
              LLM_MODEL: 'dummy',
              CLARIFYPROMPT_HOME: '/tmp/clarify-ci',
              CLARIFYPROMPT_TRACE: 'off',
            };
            const proc = spawn(process.execPath, ['dist/index.js'], { env, stdio: ['pipe', 'pipe', 'pipe'] });
            let out = '';
            proc.stdout.on('data', d => out += d);
            proc.stderr.on('data', d => process.stderr.write(d));

            const msg = JSON.stringify({
              jsonrpc: '2.0', id: 1, method: 'initialize',
              params: { protocolVersion: '2024-11-05', capabilities: {}, clientInfo: { name: 'ci', version: '0' } },
            });
            proc.stdin.write(msg + '\n');

            await new Promise(r => setTimeout(r, 3000));
            proc.kill();
            await new Promise(r => proc.on('exit', r));

            if (!/\"version\":\"/.test(out)) {
              console.error('no version field in initialize response:');
              console.error(out.slice(0, 800) || '(empty)');
              process.exit(1);
            }
            const line = out.split('\n').find(l => l.startsWith('{\"result\"'));
            console.log('server responds to initialize ✓');
            if (line) console.log(line);
          "

  # ---------------------------------------------------------------------------
  # Secret-scanning sweep. Catches accidental commits of real keys.
  # ---------------------------------------------------------------------------
  secrets-audit:
    name: secrets sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Grep for API-key patterns in tracked files
        shell: bash
        run: |
          set -e
          # OpenAI / Anthropic / xAI / Groq / Google / npm / GitHub PATs
          PATTERN='sk-[A-Za-z0-9]{20,}|sk-ant-[A-Za-z0-9]{20,}|xai-[A-Za-z0-9]{20,}|gsk_[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_\-]{35}|npm_[A-Za-z0-9]{36}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{80,}'
          if git grep -InE "$PATTERN" -- \
            ':(exclude)package-lock.json' \
            ':(exclude).github/workflows' \
            ; then
            echo "::error::Potential secret found in tracked files. Revoke it immediately and scrub from history."
            exit 1
          fi
          echo "No secret patterns found in tracked files."

      - name: .env must not be committed
        shell: bash
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked. It must be gitignored."
            exit 1
          fi
          echo ".env not tracked ✓"

  # ---------------------------------------------------------------------------
  # Eval harness — opt-in regression net for the engine surface.
  #
  # Fires on every push/PR ONLY when the OPENAI_API_KEY repo secret is set.
  # Without it: the job runs but skips the eval call with a banner explaining
  # how to enable. Failed evals fail the job (release gate).
  #
  # Cost note: on gpt-4o-mini, 17 active fixtures × ~1500 input tokens × ~600
  # output tokens ≈ ~$0.005 per CI run. The 3 model-class-specific shape
  # fixtures (tiny/mid/reasoning) skip cleanly via skip_unless_model_matches.
  #
  # To enable: add OPENAI_API_KEY in repo Settings → Secrets → Actions.
  # Forked PRs will skip automatically (forks don't have access to secrets).
  # ---------------------------------------------------------------------------
  evals:
    name: evals (opt-in via OPENAI_API_KEY)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check OPENAI_API_KEY availability
        id: check-key
        env:
          KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${KEY:-}" ]; then
            echo "OPENAI_API_KEY not configured — skipping eval harness."
            echo "To enable evals as a release gate:"
            echo "  1. Add OPENAI_API_KEY in repo Settings → Secrets → Actions."
            echo "  2. Re-run this workflow."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "OPENAI_API_KEY present — eval harness will run."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run eval harness (gpt-4o-mini)
        if: steps.check-key.outputs.skip == 'false'
        env:
          LLM_API_URL: https://api.openai.com/v1
          LLM_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: gpt-4o-mini
          EMBED_API_URL: https://api.openai.com/v1
          EMBED_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMBED_MODEL: text-embedding-3-small
          EMBED_DIMENSION: 1536
          CLARIFYPROMPT_TRACE: 'off'
        run: npm run eval

      - name: Upload eval HTML report
        if: steps.check-key.outputs.skip == 'false' && always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.sha }}
          path: evals/report.html
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Docker build smoke test. Catches: Dockerfile regressions, native-module
  # compile/fetch failures inside the image.
  # ---------------------------------------------------------------------------
  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t clarifyprompt-mcp:ci .

      - name: Smoke-test container startup
        shell: bash
        run: |
          set -e
          OUT=$(
            (
              printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}\n'
              sleep 2
            ) | docker run --rm -i \
              -e LLM_API_URL=http://127.0.0.1:1/v1 \
              -e LLM_MODEL=dummy \
              -e CLARIFYPROMPT_HOME=/tmp/clarify \
              -e CLARIFYPROMPT_TRACE=off \
              clarifyprompt-mcp:ci 2>&1 || true
          )
          echo "$OUT" | grep -q '"version":"' || {
            echo "::error::Container did not respond to initialize."
            echo "--- container output ---"
            echo "$OUT"
            exit 1
          }
          echo "Container responds to initialize ✓"

  # ---------------------------------------------------------------------------
  # npm publish on tag pushes. Gated by presence of NPM_TOKEN secret so the
  # workflow file is safe to merge without a token configured yet.
  #
  # To enable: add NPM_TOKEN secret in repo Settings → Secrets → Actions.
  # Use a Granular Access Token scoped to `clarifyprompt-mcp` with
  # "Allow this token to bypass 2FA when publishing" enabled.
  # ---------------------------------------------------------------------------
  publish:
    name: npm publish (tag only)
    if: startsWith(github.ref, 'refs/tags/v')
    # `evals` is opt-in: skips with success when OPENAI_API_KEY is unset, so
    # adding it here is a no-op for users without the secret. With the secret,
    # eval regressions block the release.
    needs: [build, secrets-audit, docker, evals]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # for provenance attestation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (= $TAG) does not match package.json version ($PKG). Bump the version in package.json first, then re-tag."
            exit 1
          fi
          echo "Tag matches package.json ✓ ($PKG)"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret not configured — skipping publish."
            echo "To enable automated publishing:"
            echo "  1. Create a Granular Access Token at npmjs.com (scope: clarifyprompt-mcp, bypass-2FA enabled)"
            echo "  2. Add it to repo Settings → Secrets → Actions as NPM_TOKEN"
            echo "  3. Re-run this workflow"
            exit 0
          fi
          npm publish --provenance --access public

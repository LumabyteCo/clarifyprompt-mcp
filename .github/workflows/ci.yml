name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Minimize scope of the default GITHUB_TOKEN — the publish job adds `id-token: write` explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Build + typecheck across supported Node versions + OSes.
  # Catches: TS regressions, dep-tree breakages, platform-specific native-module issues.
  # ---------------------------------------------------------------------------
  build:
    name: build (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install deps (with prebuilt native bindings)
        run: npm ci

      - name: Typecheck + build
        run: npm run build

      - name: Verify dist actually runs
        # Start the server, send an MCP initialize, confirm the server responds, then stop.
        # Catches: broken imports, missing files, crash-on-boot.
        # Portable across Linux + macOS (macOS lacks GNU `timeout`).
        shell: bash
        run: |
          node --input-type=module -e "
            import { spawn } from 'node:child_process';

            const env = {
              ...process.env,
              LLM_API_URL: 'http://127.0.0.1:1/v1',
              LLM_MODEL: 'dummy',
              CLARIFYPROMPT_HOME: '/tmp/clarify-ci',
              CLARIFYPROMPT_TRACE: 'off',
            };
            const proc = spawn(process.execPath, ['dist/index.js'], { env, stdio: ['pipe', 'pipe', 'pipe'] });
            let out = '';
            proc.stdout.on('data', d => out += d);
            proc.stderr.on('data', d => process.stderr.write(d));

            const msg = JSON.stringify({
              jsonrpc: '2.0', id: 1, method: 'initialize',
              params: { protocolVersion: '2024-11-05', capabilities: {}, clientInfo: { name: 'ci', version: '0' } },
            });
            proc.stdin.write(msg + '\n');

            await new Promise(r => setTimeout(r, 3000));
            proc.kill();
            await new Promise(r => proc.on('exit', r));

            if (!/\"version\":\"/.test(out)) {
              console.error('no version field in initialize response:');
              console.error(out.slice(0, 800) || '(empty)');
              process.exit(1);
            }
            const line = out.split('\n').find(l => l.startsWith('{\"result\"'));
            console.log('server responds to initialize ✓');
            if (line) console.log(line);
          "

  # ---------------------------------------------------------------------------
  # Secret-scanning sweep. Catches accidental commits of real keys.
  # ---------------------------------------------------------------------------
  secrets-audit:
    name: secrets sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Grep for API-key patterns in tracked files
        shell: bash
        run: |
          set -e
          # OpenAI / Anthropic / xAI / Groq / Google / npm / GitHub PATs
          PATTERN='sk-[A-Za-z0-9]{20,}|sk-ant-[A-Za-z0-9]{20,}|xai-[A-Za-z0-9]{20,}|gsk_[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_\-]{35}|npm_[A-Za-z0-9]{36}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{80,}'
          if git grep -InE "$PATTERN" -- \
            ':(exclude)package-lock.json' \
            ':(exclude).github/workflows' \
            ; then
            echo "::error::Potential secret found in tracked files. Revoke it immediately and scrub from history."
            exit 1
          fi
          echo "No secret patterns found in tracked files."

      - name: .env must not be committed
        shell: bash
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked. It must be gitignored."
            exit 1
          fi
          echo ".env not tracked ✓"

  # ---------------------------------------------------------------------------
  # NOTE: the eval harness moved to .github/workflows/evals.yml as of 1.5.2 so
  # it can be addressed by a dedicated badge ("evals: passing" actually means
  # evals, not "the whole CI pipeline"). The publish job below still gates on
  # the evals workflow's success on the same SHA via a cross-workflow check.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Docker build smoke test. Catches: Dockerfile regressions, native-module
  # compile/fetch failures inside the image.
  # ---------------------------------------------------------------------------
  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t clarifyprompt-mcp:ci .

      - name: Smoke-test container startup
        shell: bash
        run: |
          set -e
          OUT=$(
            (
              printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}\n'
              sleep 2
            ) | docker run --rm -i \
              -e LLM_API_URL=http://127.0.0.1:1/v1 \
              -e LLM_MODEL=dummy \
              -e CLARIFYPROMPT_HOME=/tmp/clarify \
              -e CLARIFYPROMPT_TRACE=off \
              clarifyprompt-mcp:ci 2>&1 || true
          )
          echo "$OUT" | grep -q '"version":"' || {
            echo "::error::Container did not respond to initialize."
            echo "--- container output ---"
            echo "$OUT"
            exit 1
          }
          echo "Container responds to initialize ✓"

  # ---------------------------------------------------------------------------
  # npm publish on tag pushes. Gated by presence of NPM_TOKEN secret so the
  # workflow file is safe to merge without a token configured yet.
  #
  # To enable: add NPM_TOKEN secret in repo Settings → Secrets → Actions.
  # Use a Granular Access Token scoped to `clarifyprompt-mcp` with
  # "Allow this token to bypass 2FA when publishing" enabled.
  # ---------------------------------------------------------------------------
  publish:
    name: npm publish (tag only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, secrets-audit, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # for provenance attestation
      actions: read     # for the cross-workflow evals gate query below
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Cross-workflow gate: wait for evals.yml on this SHA to land at
      # success (or skipped via no secret, which we treat as success too —
      # the harness logs the "OPENAI_API_KEY not configured" banner and
      # exits 0). Polls every 20s for up to 15 minutes; fails the publish
      # if evals.yml ends in failure or never runs.
      - name: Wait for evals workflow on this SHA
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const sha   = context.sha;
            const deadline = Date.now() + 15 * 60 * 1000; // 15 min
            let last = null;
            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, head_sha: sha, per_page: 50,
              });
              const run = data.workflow_runs.find(r => r.path === '.github/workflows/evals.yml');
              if (!run) {
                core.info(`evals.yml run for ${sha.slice(0,7)} not found yet; waiting...`);
              } else {
                last = run;
                core.info(`evals.yml status=${run.status} conclusion=${run.conclusion}`);
                if (run.status === 'completed') break;
              }
              await new Promise(r => setTimeout(r, 20_000));
            }
            if (!last) core.setFailed(`No evals.yml run found for ${sha} within 15min`);
            else if (last.conclusion !== 'success') core.setFailed(`evals.yml conclusion=${last.conclusion}`);
            else core.info('evals workflow passed on this SHA — proceeding with publish.');

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (= $TAG) does not match package.json version ($PKG). Bump the version in package.json first, then re-tag."
            exit 1
          fi
          echo "Tag matches package.json ✓ ($PKG)"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret not configured — skipping publish."
            echo "To enable automated publishing:"
            echo "  1. Create a Granular Access Token at npmjs.com (scope: clarifyprompt-mcp, bypass-2FA enabled)"
            echo "  2. Add it to repo Settings → Secrets → Actions as NPM_TOKEN"
            echo "  3. Re-run this workflow"
            exit 0
          fi
          npm publish --provenance --access public

  # ---------------------------------------------------------------------------
  # Publish the container image to GitHub Container Registry (ghcr.io).
  #
  # SECURITY: no stored secret. ghcr is GitHub, so auth uses the built-in,
  # ephemeral, auto-masked GITHUB_TOKEN (scoped to this repo, dies with the run)
  # — there is no PAT to create or rotate. The image is built from explicit
  # COPYs (never `COPY . .`) behind a hardened .dockerignore, so no .env / keys
  # can enter any layer; the `docker` + `secrets-audit` jobs gate this one.
  # Ships keyless (Sigstore) provenance + an SBOM attestation for supply-chain
  # trust. Runs on tag pushes and manual dispatch (so you control the first one).
  #
  # NOTE: the first push creates a PRIVATE package. To let anyone `docker pull`,
  # make it public once: GitHub → repo → Packages → clarifyprompt-mcp →
  # Package settings → Change visibility → Public.
  # ---------------------------------------------------------------------------
  docker-publish:
    name: ghcr publish (tag / manual)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build, secrets-audit, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to ghcr.io (via GITHUB_TOKEN)
      id-token: write       # keyless Sigstore signing of attestations
      attestations: write   # provenance + SBOM
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # drop the git token; this job never pushes to git

      - name: Verify tag matches package.json version (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          [ "$TAG" = "$PKG" ] || { echo "::error::Tag $GITHUB_REF_NAME != package.json ($PKG)"; exit 1; }
          echo "Tag matches package.json ✓ ($PKG)"

      - name: Resolve version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Third-party actions are SHA-pinned (immutable) — a moved tag can't inject
      # code into this attestations:write / id-token:write job. Comments track the version.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130   # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f   # v3

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9   # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # ephemeral, auto-masked; NOT a PAT

      - name: Image metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051   # v5
        with:
          images: ghcr.io/${{ github.repository }}   # metadata-action lowercases the name
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            # `latest` moves on a real release tag OR a deliberate manual dispatch
            # (the only two triggers this job runs on — both maintainer-controlled).
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=clarifyprompt-mcp
            org.opencontainers.image.description=Context-aware MCP prompt compiler (stdio | streamable-http | a2a)
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build + push (multi-arch, signed provenance + SBOM)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8   # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

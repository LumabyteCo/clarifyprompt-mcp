name: evals

# Dedicated eval-harness workflow. Lives in its own file (separate from ci.yml)
# so it can be addressed by a dedicated badge (`evals: passing` is what the
# badge actually means — not "the whole CI pipeline").
#
# Opt-in: only runs the eval call when OPENAI_API_KEY repo secret is set.
# Without the secret, the job logs a banner + exits success (no-op).
#
# Cost note: on gpt-4o-mini, 17 active fixtures × ~1500 input tokens × ~600
# output tokens ≈ ~$0.005 per run. Fork PRs run without secrets and skip.
#
# To enable: add OPENAI_API_KEY in repo Settings → Secrets → Actions.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  evals:
    name: evals (opt-in via OPENAI_API_KEY)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check OPENAI_API_KEY availability
        id: check-key
        env:
          KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${KEY:-}" ]; then
            echo "OPENAI_API_KEY not configured — eval harness skipped (no-op)."
            echo "To enable evals as a release gate:"
            echo "  1. Add OPENAI_API_KEY in repo Settings → Secrets → Actions."
            echo "  2. Re-run this workflow."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "OPENAI_API_KEY present — eval harness will run."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run eval harness (gpt-4o-mini)
        if: steps.check-key.outputs.skip == 'false'
        env:
          LLM_API_URL: https://api.openai.com/v1
          LLM_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL: gpt-4o-mini
          # gpt-4o-mini occasionally takes >30s for long prompts; the default
          # 30s LLM client timeout would surface those as eval errors rather
          # than real assertion failures. 120s is generous headroom.
          LLM_TIMEOUT_MS: 120000
          EMBED_API_URL: https://api.openai.com/v1
          EMBED_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMBED_MODEL: text-embedding-3-small
          EMBED_DIMENSION: 1536
          CLARIFYPROMPT_TRACE: 'off'
        run: npm run eval

      - name: Upload eval HTML report
        if: steps.check-key.outputs.skip == 'false' && always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.sha }}
          path: evals/report.html
          if-no-files-found: ignore
          retention-days: 30

  platform: higgsfield
  # The curator must select 'platform-hints' for Higgsfield to surface its
  # syntax hints (model identifiers + cinematic prose conventions). If the
  # platform entry didn't load, this source wouldn't exist.
  grounding_sources_must_include: ['platform-hints']
  no_error: true

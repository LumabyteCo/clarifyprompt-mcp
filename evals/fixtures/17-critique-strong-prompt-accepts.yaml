name: critique-strong-prompt-accepts
description: 'A specific, well-formed prompt should score highly across all dimensions. We assert engine-wiring invariants (5+ dimensions, the standard 3 dimension names present, no harness error) rather than a single verdict label — different judge models calibrate strictness differently (gpt-4o-mini occasionally REJECTS this prompt while qwen-coder-7b ACCEPTS it). The harness assertion stays focused on what is deterministic about the engine.'
tags: [critique, judge, regression]
input:
  tool: critique_prompt
  prompt: |
    You are a senior TypeScript engineer reviewing a pull request.
    Audience: a junior contributor on the same team.
    Task: review the diff below and produce one comment per concern, ordered most-critical first.
    Format: bullet list. Each bullet ≤ 25 words. Cite the file:line being discussed.
    Tone: warm, direct, never condescending. End with a single "ship/hold" recommendation.
    If you spot fewer than three concerns, return only the ones you actually found — don't pad.
  skip_rewrite: false
expected:
  # Engine-wiring invariants (deterministic across models):
  dimensions_min: 5
  dimension_must_include: ['clarity', 'specificity', 'format_fitness']
  no_error: true
  # Soft assertion via score_min — set low enough that even a strict judge
  # won't fail it on a well-formed prompt. Genuine engine failure would
  # score 0; here we just want "above floor."
  overall_score_min: 3

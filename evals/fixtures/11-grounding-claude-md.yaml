name: grounding-claude-md-applied
description: 'When a CLAUDE.md exists in the workspace, its rules surface in the optimized output. The killer demo from 1.2 — proves the Context Engine is not cosmetic.'
tags: [grounding, project-rules]
requires_workspace:
  'package.json': |
    { "name": "brand-landing", "dependencies": { "next": "^14", "react": "^18" } }
  'CLAUDE.md': |
    # Brand Landing rules
    - Tone: confident, warm, concise
    - Voice: second-person, active
    - Always include a clear CTA
input:
  prompt: 'write a hero headline for our new AI copilot'
  category: document
  platform: claude
  mode: concise
  skip_intent_resolution: true
expected:
  # Deterministic check: grounding.sources must include 'project-rules',
  # which proves the workspace CLAUDE.md was loaded by the Context Engine
  # AND selected by the Context Curator (i.e., the rule made it into the
  # final grounding block sent to the LLM).
  #
  # We deliberately do NOT assert the OUTPUT contains "CTA" — that's an
  # LLM-choice assertion that flakes across models because they often
  # paraphrase ("Get started today" IS a CTA, just not the literal string).
  # We also don't assert system_prompt_must_contain because in this engine
  # project rules land in the USER prompt's grounding block, not the
  # SYSTEM message. The grounding-source assertion is the cleanest proof
  # the rule was actually applied at curate-time.
  grounding_sources_must_include: ['project-rules']
  no_error: true

    source: "https://help.openai.com/en/articles/20001152-what-to-know-about-the-sora-discontinuation"
    groundedContext: "Sora 2 is retired: OpenAI discontinued the Sora web app on 2026-04-26 and shut down the Videos API and all sora-2 model ids on 2026-09-24, with no replacement named. If asked for Sora prompts, say it is no longer available and suggest current video models instead (Veo 3.1, Kling 3.0, Runway Gen-4.5, Seedance 2.0)."
    current: ["discontinu", "shut down", "no longer", "retired", "deprecat", "closed", "sunset", "was removed"]
    stale: []
    unknown: ["not familiar", "don't know", "do not know", "cannot find", "no information", "since my training", "knowledge cutoff", "may have changed", "as of my last"]
    missing_means_stale: true


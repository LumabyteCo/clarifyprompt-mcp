# Dialect-currency benchmark — raw-model probe (NOT an engine eval).
#
# The question: can today's models, unprompted, write prompts in the CURRENT
# dialect of the platforms they target — or do they emit the frozen dialect
# of their training data?
#
# Each fact = a natural ask + the verified current truth + the stale
# signature expected from frozen weights. All facts verified against
# current platform docs / vendor pages on 2026-10-05 (source URLs inline).
#
# Sora 2 is included DELIBERATELY as the retired-platform probe: OpenAI
# discontinued the consumer app on 2026-04-26 and shut the Videos API on
# 2026-09-24 with no replacement. A model that fluently writes a Sora prompt
# is hallucinating currency — that is the point.
#
# GROUNDED MODE (BENCH_GROUNDED=1): each fact also carries `groundedContext`
# — the current-dialect reference drawn from the same verified pack data
# clarifyprompt-mcp ships (packs/platforms/*.yaml). The raw condition measures
# what models KNOW alone; the grounded condition measures what they can DO
# with a maintained knowledge layer. Contexts are phrased to avoid
# stale-marker collisions so grading stays comparable across conditions.
#
# Grading (case-insensitive substring markers on the model's reply):
#   current  — reply contains a current-dialect marker, no stale marker
#   mixed    — contains both (e.g. names Veo 3 but describes 2-minute clips)
#   stale    — contains a stale marker; or (missing_means_stale) wrote the
#              prompt fluently with no disclaimer at all
#   unknown  — model says it doesn't know the platform / hedges on cutoff
#              (honest, but still useless to a user asking today)
#   none     — no markers either way (no evidence of dialect knowledge)
#   empty    — model returned no content (thinking-channel exhaustion)

facts:
  - id: midjourney-version
    platform: Midjourney
    ask: "Write a Midjourney prompt for: a dragon flying over a castle at sunset."
    verified: "Current default is V8.2; V7 shipped 2025-04-03 and was default through 2026-06-09; V8.x adds the Edit Model and --hd/--sd. Frozen 2024 weights emit --v 6 / --v 6.1."
    verifiedAt: "2026-10-05"
    source: "https://docs.midjourney.com/hc/en-us/articles/32199405667853-Version"
    groundedContext: "Midjourney's current default model version is V8.2 — pin it with --v 8.2. Parameter strip: --ar W:H, --stylize 0-1000 (default 100), --chaos 0-100, --q (1, 2, or 4), --style raw for photorealism, --sref <url|code> style references, --edit for the V8.x Edit Model (written instructions + up to 4 reference images)."
    current: ["--v 7", "--v 8", "--version 7", "--version 8", "version 7", "version 8", "v7", "v8"]
    stale: ["--v 6", "--v 5", "version 6", "version 5", "v6"]


    verified: "Current line is Veo 3.1 (Standard/Fast/Lite; 4K, native/spatial audio, 8s clips extendable). Veo 2 (2024) had no native audio and the old 'up to 2 minutes' claim does not describe any current tier."
    verifiedAt: "2026-10-05"
